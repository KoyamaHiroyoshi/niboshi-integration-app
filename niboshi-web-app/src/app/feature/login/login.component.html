<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 350px;">
    <h2 class="text-center">ログイン</h2>
    <form [formGroup]="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">メールアドレス</label>
        <input type="email" class="form-control" id="email" placeholder="メールアドレスを入力" formControlName="email">
        <div *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched" class="text-danger">
          メールアドレスを入力してください
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">パスワード</label>
        <input type="password" class="form-control" id="password" placeholder="パスワードを入力" formControlName="password">
        <div *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched" class="text-danger">
          パスワードを入力してください
        </div>
      </div>

      <!-- ✅ エラーメッセージを表示 -->
      <div *ngIf="errorMessage" class="text-danger text-center mt-2">
        {{ errorMessage }}
      </div>

      <button type="button" class="btn btn-primary w-100" (click)="login()">ログイン</button>
    </form>


    <p class="text-center mt-3">
      <a href="#">パスワードを忘れた場合</a>
    </p>
  </div>
</div>
