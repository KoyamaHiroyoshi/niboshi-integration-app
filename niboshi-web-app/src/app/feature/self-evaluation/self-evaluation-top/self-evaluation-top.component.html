<app-layout-header></app-layout-header>
<!-- 上部の登録ボタン -->
<div class="container mt-4">
    <a class="nav-link active" aria-current="page" href="/SelfEvaluation-Regist"><button id="registerBtn"
            class="btn btn-primary w-100">登録</button></a>

</div>

<!-- 検索入力 -->
<div class="container mt-3">
    <input type="text" id="searchInput" class="form-control" placeholder="検索ワードを入力">
</div>

<!-- 検索結果リスト -->
<div class="container mt-3">
    <ul id="searchResults" class="list-group">
        <!-- 検索結果がここに追加される -->
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('searchInput').addEventListener('input', function () {
        const query = this.value.toLowerCase();
        const results = ['アイテム1', 'アイテム2', 'アイテム3', 'アイテム4'] // 仮のデータ
            .filter(item => item.toLowerCase().includes(query));

        const resultList = document.getElementById('searchResults');
        resultList.innerHTML = '';
        results.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = item;
            resultList.appendChild(li);
        });
    });

    document.getElementById('registerBtn').addEventListener('click', function () {
        alert('登録ボタンがクリックされました！');
    });
</script>





<app-layout-footer></app-layout-footer>
